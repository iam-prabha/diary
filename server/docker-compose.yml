services:
  db:
    image: postgres:16-alpine
    container_name: diary-test-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: diary_test
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d diary_test"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - diary-test-pgdata:/var/lib/postgresql/data

volumes:
  diary-test-pgdata:
